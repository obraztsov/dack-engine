# dack.config.yaml — the operator control plane.
#
# Copy to dack.config.yaml (keep it GITIGNORED) and fill in your operator DID + model endpoint.
# Secret VALUES never live here — only references and provider definitions. The agent may read
# selected fields but can never write this file. Most changes hot-reload on the next dispatch.
#
# This is a commented, runnable example. The exhaustive field reference is docs/configuration.md.

# ── Required ──────────────────────────────────────────────────────────────────────────────────
# The trusted operator DID. Generate it (native Ed25519, no gitlawb):
#   dack keygen --role operator --dir identities/operator   → prints the did:key to paste here
# `dack say` signs an instruction with that operator key; the harness verifies it against this DID —
# that is what makes a stimulus `operator_signed` (the top trust tier).
operator_did: "did:key:z6MkOperatorReplaceMe"

# Where the agent's durable bundle (SOUL.md, prompts/, stimuli/, memory/) lives. Start from the public
# template:  git clone https://github.com/obraztsov/dack-soul.git my-soul
soul_repo: "my-soul"

# ── Runtime: how the agent reaches a model ──────────────────────────────────────────────────────
# `engine` = the agent runtime (only `openclaude` is wired — spawns `bun run bridge.ts`).
# `connector` = how it reaches models. `openai-compatible` targets any OpenAI-compatible endpoint (a
#   hosted gateway, a provider-direct API, a local vLLM); it routes the per-state model via the child's
#   OPENAI_MODEL env and sets CLAUDE_CODE_USE_OPENAI itself. (`type: opengateway` still parses, aliased.)
# `model` = the default model id; tier_policy.<state>.model overrides it per state.
runtime:
  engine: { type: openclaude, bridge_dir: openclaude-bridge }
  # engine: { type: duck-loop }          # EXPERIMENTAL — DACK's OWN agent-loop runtime (duck-loop/) in place
                                          # of the OpenClaude SDK. Same NDJSON protocol + same connector env;
                                          # text cycles work today, MCP tools + the wall are WIP (M5).
  connector:
    type: openai-compatible
    api_url: "https://your-provider/v1"     # → OPENAI_BASE_URL (omit to take from the daemon env)
    api_key: "…"                            # → OPENAI_API_KEY (gitignored config only; omit → env)
    # api_format: chat_completions          # → OPENAI_API_FORMAT. Default `chat_completions` (/chat/completions).
                                            # `responses` targets the newer /responses surface (reasoning as first-
                                            # class items; may help multi-turn tool-calling). Works on Xiaomi as of the
                                            # vendored-SDK SSE patch (2026-08-05); still an experiment — single-turn
                                            # quality is neutral, so validate on a throwaway before enabling per provider.
  model: "your-default-model-id"
  # Multimodal images (Phase 1): `vision_models` = the ids that accept image input. An image-bearing
  # Perceive KEEPS its selected model when that model is already a vision model (so you can run a cheap
  # vision model on the whole perceive phase), else ROUTES to `default_vision_model`. Omit both ⇒ images
  # are not ingested (attaching one to a non-vision model would fail).
  # vision_models: [mimo-v2.5]
  # default_vision_model: mimo-v2.5

# Everything below is OPTIONAL — shown with sensible values. Delete what you don't need.

# ── Trust lattice (the taint model) ─────────────────────────────────────────────────────────────
# Ordered low→high; each tier's `reaches` is the highest consciousness state a cycle at that tier may
# walk to. A cycle starts at a provenance-seeded tier and only ratchets DOWN as it touches data, so a
# cycle that reads public data can never reach an irreversible/self-editing state. The default is the
# block below; add custom tiers (e.g. `org`) between the well-known ones. See docs/concepts.md.
trust_tiers:
  - { name: public, reaches: express }            # untrusted world (tweets, 3rd-party data)
  # - { name: org,  reaches: settle }             # example: a vetted peer/channel — may trade
  - { name: self,   reaches: reflect }            # the agent's own clean data — may even self-edit
  - { name: operator_signed, reaches: reflect }   # a DID-signed operator instruction

# PROTECTED memory files — writable ONLY in Reflect (same rule as prompts/stimuli/SOUL.md). Any memory file
# the engine injects into EVERY context (notably `memory/INDEX.md`, the self-orientation catalogue) belongs
# here, so a non-Reflect cycle can't rewrite what rides every prompt. Empty by default.
# protected_memory_paths: [memory/INDEX.md]

# Per-webhook trust anchor: a webhook path → the tier a stimulus on it is seeded at. The listener is
# localhost-only, so only a local channel adapter can post; the tier is the operator's call.
# webhooks:
#   "/telegram/op":  org
#   "/telegram/pub": public
#   "/pond/events":  public       # leader billing/lifecycle events (pond-ingress). Platform-authored, but
                                  #   Express is all a notification needs — seed low, cap the walk.

# ── Capabilities (MCP servers) ──────────────────────────────────────────────────────────────────
# The agent's tools. `tier` = what kind of action (read=any state · post=Express · settle=Settle).
# `trust` = the taint label of the data it puts in play (public-world tools MUST be trust:public).
# `min_trust` = authorization floor. `tools` = a fail-closed allowlist. `scope_env` = per-cycle data
# locked into the server's env. `auth.secret` names a secrets_providers entry. See docs/capabilities.md.
mcp_servers:
  - name: twitter
    transport: { type: stdio, command: bun, args: [run, mcp/twitter-mcp.ts] }
    auth: { secret: x, env: X_BEARER_TOKEN }
    tier: post
    trust: public
  # - name: telegram                              # destination-locked reply (open to any tier)
  #   transport: { type: stdio, command: bun, args: [run, mcp/telegram-mcp.ts] }
  #   auth: { secret: telegram_bot, env: TELEGRAM_BOT_TOKEN }
  #   tier: post
  #   scope_env: { TELEGRAM_REPLY_CHAT: chat_id, TELEGRAM_REPLY_TO: message_id }
  # - name: cove-read                             # read subset of a wallet API (own data → trust:self)
  #   transport: { type: http, url: "https://your-wallet/api/mcp" }
  #   auth: { secret: cove_read }                 #   → Authorization: Bearer <tok> (the default)
  #   tier: read
  #   trust: self
  #   tools: [get_balance, get_positions, simulate_swap]
  # - name: memclaw                               # an HTTP server with a NON-STANDARD auth header
  #   transport: { type: http, url: "https://memclaw.net/mcp" }
  #   auth: { secret: memclaw, header: X-API-Key } #   → X-API-Key: <tok> (custom header ⇒ raw, no "Bearer ")
  #   tier: read                                  #   set scheme: "Token"/"" to override the prefix
  #   trust: public
  # - name: pond-management                       # duck-as-CEO surface over the pond (leader /v1/manager).
  #   transport: { type: stdio, command: bun, args: [run, mcp/pond-mcp.ts] }
  #   auth: { secret: pond_manager, env: MANAGER_JWT }   # the leader credential — never model-visible
  #   env: { POND_LEADER_URL: "http://127.0.0.1:7700" }
  #   tier: post
  #   trust: self
  #   scope_env: { POND_ACTING_TG_ID: from_user_id }     # THE id-gate: the acting user's authenticated tg id,
  #                                                      #   injected below cognition — the model has no user-id
  #                                                      #   argument, so it can only act on the asker's agents.
  #                                                      #   Grant in DM-woken states ONLY (never public-reply).
  # ── Agentic skills: plain-text SKILL.md skills + a Settle-only sandboxed shell (see docs/skills.md) ──
  # - name: skills                                # READ-ONLY skill navigation (list_skills / view_skill).
  #   transport: { type: stdio, command: bun, args: [run, mcp/skills-mcp.ts] }   #   tier:read = safe every state.
  #   env: { SKILLS_ROOT: skills }                # the soul's skills/ dir (SKILL.md + references/).
  #   tier: read
  #   trust: self
  # - name: bash                                  # run a plain-text skill's CLI/curl in a CONFINED sandbox.
  #   transport: { type: stdio, command: bun, args: [run, mcp/bash-mcp.ts] }     #   tier:settle → Settle-ONLY
  #   tier: settle                                #   (irreversible; a clean cycle only). Default-OFF = don't list it.
  #   env:                                        #   Requires bubblewrap (Kata/privileged container — docs/skills.md).
  #     BASH_WORKSPACE: sandbox/work              #   the ONLY writable dir (root-created; NOT in the soul).
  #     BASH_SKILL_DIRS: skills/bankr             #   `:`-sep skill dirs mounted read-only.
  #     BASH_SECRET_ENV: BANKR_API_KEY            #   env NAMES forwarded into the sandbox (values via auth.secret).
  #   auth: { secret: bankr, env: BANKR_API_KEY } #   the scoped skill key — reaches bash, never the model.
  # - name: notify                                # OP-NOTIFY lane (NOT a messenger — see the notify-router module below).
  #   transport: { type: stdio, command: bun, args: [run, mcp/notify-mcp.ts] }   # `notify{severity,title?,message}`:
  #   env: { NOTIFY_URL: "http://127.0.0.1:8794/notify" }   #   the model reports an operational error/alert/info to the
  #   tier: post                                  #   operator's configured targets. DESTINATIONS are config (below),
  #   scope_env: { NOTIFY_SOURCE_CHAT: chat_id }  #   never a model arg → nothing to hijack; safe from ANY cycle.
  #                                               #   Reply-to-a-client is a normal SEND baton; this is the error TRAIL.

# The operator half of the capability handshake: a state-prompt requests a server in its `mcp:`
# frontmatter; it's admitted only if listed here. mcp_whitelist:false = an OPEN tier (the soul may also
# inline a public, secret-less READ MCP). model:/allow_model_override: the per-state model split.
tier_policy:
  perceive: { mcp_whitelist: false, import: [] }   # open: may self-plug public reads
  express:  { import: [twitter] }
  settle:   { import: [] }
  reflect:  { import: [], allow_model_override: true }

# ── Secrets ─────────────────────────────────────────────────────────────────────────────────────
# A provider is a harness-owned script that fetches/rotates a short-lived token and prints a JSON env
# map. A duty's `secrets:` or a capability's `auth.secret` references it by name; the token is injected
# into that consumer ONLY, never the agent's model context. `trust:` = the taint label of its data.
secrets_providers:
  - name: x
    command: ["python3", "secrets-providers/x_oauth2.py"]
    env: { X_STORE: "secrets/x.json" }              # one store: {client_id, client_secret, refresh_token, access_token, …}
    keys: [X_BEARER_TOKEN]
    trust: public                                  # the X bearer touches the public world
  # - name: telegram_bot
  #   command: ["python3", "secrets-providers/file_token.py"]
  #   env: { TOKEN_KEY: TELEGRAM_BOT_TOKEN, TOKEN_FILE: "secrets/telegram.token" }
  #   keys: [TELEGRAM_BOT_TOKEN]
  #   trust: org
  # - name: buzz_key                              # the duck's buzz (Nostr) identity — used by buzz-ingress AND
  #   command: ["python3", "secrets-providers/file_token.py"]  #   the notify-router's buzz connector.
  #   env: { TOKEN_KEY: BUZZ_PRIVATE_KEY, TOKEN_FILE: "secrets/buzz.key" }
  #   keys: [BUZZ_PRIVATE_KEY]
  #   trust: self
  # - name: pond_manager                          # the leader manager JWT (mint: `leader token --scope
  #   command: ["python3", "secrets-providers/file_token.py"]  #   duck:manager --sub dack-manager --ttl 30d`)
  #   env: { TOKEN_KEY: MANAGER_JWT, TOKEN_FILE: "secrets/pond_manager.token" }
  #   keys: [MANAGER_JWT]
  #   trust: self

# Env-var NAMES forwarded into the agent + sensors (values from the daemon env, never YAML). Recoverable
# values only — a leak means rotate. The Soul DID key is NEVER here (it's a harness-only reference).
forwarded_env: [DACK_HANDLE, RATE_LIMIT]

# File references (the harness resolves them; values never inline here). The Soul DID key is harness-only.
secrets:
  soul_did_key: "file:///run/secrets/soul_did_key"

# ── Channels (long-running adapters the harness supervises) ──────────────────────────────────────
# A module is spawned at boot with its declared secrets injected, restart-supervised, torn down on
# shutdown. It normalizes a channel protocol into a webhook POST. See docs/channels.md.
# modules:
#   - name: telegram-ingress
#     command: [bun, run, mcp/telegram-ingress.ts]
#     secrets: [telegram_bot]
#     env: { TELEGRAM_INGRESS_CONFIG: telegram-ingress.config.json }
#   - name: pond-ingress                          # leader stimulus socket → duck wakes (billing events…).
#     command: [bun, run, mcp/pond-ingress.ts]    #   Durable-journal cursor discipline: replay-then-stream.
#     secrets: [pond_manager]
#     env: { POND_LEADER_URL: "http://127.0.0.1:7700", INGRESS_DB: ingress.sqlite }  # same file as `ingress_db`
#   - name: notify-router                         # the OP-NOTIFY sink: one operational/error TRAIL (not messaging).
#     command: [bun, run, mcp/notify-router.ts]   #   Fed by the harness `notify_url` hook, the `notify` MCP, and the
#     secrets: [telegram_bot, buzz_key]           #   swallowed-answer detector. Routes per severity → telegram / a
#     env:                                        #   buzz ops-channel / jsonl. Config: notify.config.json (below).
#       NOTIFY_CONFIG: notify.config.json
#       BUZZ_BIN: /usr/local/bin/buzz             #   buzz connector: the buzz CLI path…
#       BUZZ_RELAY_URL: "https://buzz.a.pond.city" #  …and the relay (buzz_key secret → BUZZ_PRIVATE_KEY).

# ── Delegated workers (Docker isolation) ─────────────────────────────────────────────────────────
# When enabled, an agent def with `isolation: docker` runs its worker's bridge in a container. Build
# the image first: `docker build -f Dockerfile.worker -t dack/worker:latest .`. See docs/workers.md.
# runtime.worker_sandbox:               # (nest under `runtime:` above)
#   enabled: false
#   image: dack/worker:latest

# ── Soul push destinations + identities ──────────────────────────────────────────────────────────
# The soul is ONE local git repo; `soul_remotes` is the LIST of places the harness pushes it (a plain
# `git push`) after each cycle. Several entries = redundancy (a reliable primary + best-effort
# mirrors). `required: true` makes a push failure to THAT target fail the cycle's push; default false
# = best-effort (logged, re-pushed next cycle — a down mirror never blocks the agent). Omit the whole
# list for local-only (commits, no push). GITIGNORE /identities/ — these are private keys.
# soul_remotes:
#   - url: "git@github.com:youruser/my-soul.git"   # SSH primary: add a deploy key to the repo;
#     required: true                               #   no token needed, the ambient key authenticates
#   - url: "https://github.com/youruser/my-soul.git"   # HTTPS alt: token read from the daemon env
#     auth: { token_env: GITHUB_TOKEN }                #   (a fine-grained PAT with contents:write)
#   - url: "git@git.self-hosted.example:my-soul.git"   # a self-hosted mirror (best-effort)
#
# Legacy single-remote form (still supported; becomes a one-element best-effort list):
# soul_remote: "git@github.com:youruser/my-soul.git"
#
# REMOTE-AUTHORITATIVE soul (opt-in): reconcile the local soul with the PRIMARY remote at boot —
# adopt config an operator pushed externally, keep the duck's own memory — so you reconfigure a duck
# by pushing config + restarting. Safe: skips a dirty tree; a divergence snapshots local HEAD to a
# `pre-sync-<ts>` branch before adopting the remote. Default false (local-authoritative).
# soul_remote_authority: true
# soul_local_paths: [memory/]   # duck-owned paths kept LOCAL during that reconcile (default: memory/)

identities:
  operator: "identities/operator"  # signs `dack say`  — make it with `dack keygen --role operator …`
  soul: "identities/soul"          # attributes soul commits; harness-only, NEVER in agent env
  # builder: "identities/builder"  # env-forwardable outward-creation key (optional)
  # backend: local                 # native Ed25519 (the only backend; no external tools)

# ── Behavior knobs (all optional; defaults shown) ────────────────────────────────────────────────
default_entry: perceive                  # state-prompt that `dack say` / the boot ping enter at
reflect_schedule: "0 4 * * *"            # cron for the nightly self-modification run (omit for manual)
reflect_min_interval_secs: 86400         # min seconds between Reflect runs (self-edit cadence); 0 = off
session_ttl_secs: 3600                   # idle seconds before a sticky engine session is dropped
queue_max_depth: 10000                   # load-shed cap: evict OLDEST low-prio items over this (Normal+ kept); null = unbounded
# baton_ttl_secs: 86400                  # expire a deferred baton older than this (stale context); omit = never expire
db_path: "dack.sqlite"                   # embedded queue (ephemeral; losing it loses only the queue)
# media_dir: "media"                     # Phase 1 images: harness-owned dir a channel adapter drops photos into
# media_retention_days: 7                # delete stored media older than N days (0 = keep forever)
# ingress_db: "ingress.sqlite"           # telegram-ingress store (per-chat attachment perms); injected as INGRESS_DB into MCP servers
webhook_addr: "127.0.0.1:8787"           # localhost-only webhook listener
invoke_timeout_secs: 300                 # budget for one consciousness invocation
# reflect_invoke_timeout_secs: 900       # optional LONGER budget for Reflect (daily self-mod); omit ⇒ uses the above
# notify_url: "http://127.0.0.1:8794/notify"  # OP-NOTIFY router endpoint. Set it to turn on the operational/error
                                         # TRAIL: a TERMINAL dispatch failure POSTs `error` here, and any prompt with
                                         # `notify_on_silent: true` in its frontmatter POSTs `alert` when its cycle
                                         # produces nothing (a reply that died in a thought). Needs the notify-router
                                         # module (above). Omit ⇒ off. NOT a messaging lane — replies are SEND batons.

# Dry-run (testing): the wall denies any tool whose name starts with a `block` prefix — the agent
# composes the action (visible in the runlog) but it never executes. Tool-level + uniform across MCPs.
dry_run:
  enabled: false
  block: []
  # block: [mcp__twitter__post, mcp__twitter__reply]
